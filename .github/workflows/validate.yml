name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skills
        run: scripts/validate-skills.sh
      - name: Test Ultra lens ownership
        run: bash tests/ultra-lenses.sh
      - name: Test Ultra owned change detection
        run: python3 tests/ultra-owned-changes.py
      - name: Test Ultra canonical routing
        run: bash tests/ultra-canonical-routing.sh --contract
      - name: Test Ultra complementary profiles
        run: bash tests/ultra-complementary-profiles.sh
      - name: Test Ultra routing and review contract
        run: bash tests/ultra-routing-review.sh
      - name: Test Ultra v1.1 catalog
        run: bash tests/ultra-v1-1-catalog.sh
      - name: Test Ultra solve boundaries
        run: bash tests/ultra-solve-boundaries.sh
      - name: Test Ultra solve context routing
        run: bash tests/ultra-solve-context-routing.sh
      - name: Test Ultra solve eval harness
        run: bash tests/ultra-solve-eval-harness.sh
      - name: Test candidate finalization
        run: python3 tests/candidate-finalization.py
      - name: Test landing WIP eval grader
        run: python3 tests/landing-wip-eval.py
      - name: Test Maintainer Board
        run: bash tests/maintainer-board.sh
      - name: Test Obsidian workspace
        run: python3 tests/obsidian-workspace.py
      - name: Test installed Obsidian workspace
        run: python3 tests/obsidian-workspace-install.py
      - name: Test Obsidian setup
        run: python3 tests/obsidian-workspace-setup.py
      - name: Test agent-worktree
        run: tests/agent-worktree.sh
